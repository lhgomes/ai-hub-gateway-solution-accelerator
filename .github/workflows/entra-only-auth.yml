name: Entra ID-only authentication policy validation

on:
  push:
    branches:
      - feature/entra-id-only-auth
    paths:
      - "scripts/entra_only_auth.py"
      - "validation/tests/test_entra_only_auth.py"
      - "bicep/infra/entra-only-auth/**"
      - "bicep/infra/citadel-publish-contracts/**"
      - "bicep/infra/citadel-access-contracts/modules/foundryConnection.bicep"
      - ".github/workflows/entra-only-auth.yml"
  pull_request:
    paths:
      - "scripts/entra_only_auth.py"
      - "validation/tests/test_entra_only_auth.py"
      - "bicep/infra/entra-only-auth/**"

permissions:
  contents: read

jobs:
  policy-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Entra policies and fail-closed grants
        run: python -m unittest discover -s validation/tests -p "test_entra_only_auth.py" -v
      - name: Compile MCP/A2A publisher and keyless Foundry Bicep
        run: |
          az bicep build --file bicep/infra/citadel-publish-contracts/main.bicep --stdout >/dev/null
          az bicep build --file bicep/infra/entra-only-auth/foundry-connection.bicep --stdout >/dev/null
